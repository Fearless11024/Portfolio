<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page not found</title>
<meta name="theme-color" content="#0a0a12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='40' font-weight='700' text-anchor='middle' fill='white'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--a1:#7c5cff;--a2:#22d3ee;--a3:#ff4fa3;--ease:cubic-bezier(.22,1,.36,1);}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#0a0a12;color:#eceaf7;font-family:'Inter',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
.aurora{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.aurora span{position:absolute;border-radius:50%;filter:blur(110px);opacity:.35;animation:drift 20s ease-in-out infinite alternate;}
.aurora span:nth-child(1){width:480px;height:480px;background:var(--a1);top:-120px;left:-100px;}
.aurora span:nth-child(2){width:420px;height:420px;background:var(--a3);bottom:-140px;right:-100px;opacity:.22;animation-delay:-9s;}
@keyframes drift{to{transform:translate(60px,40px) scale(1.12);}}
.box{position:relative;animation:up .9s var(--ease) both;}
@keyframes up{from{opacity:0;transform:translateY(26px);}}
.label{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--a3);margin-bottom:6px;animation:blink 1.6s steps(2) infinite;}
@keyframes blink{50%{opacity:.35;}}
.code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(100px,26vw,220px);line-height:1;letter-spacing:-.04em;background:linear-gradient(120deg,var(--a1),var(--a2) 60%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent;animation:bob 5s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-12px);}}
h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(24px,5vw,34px);margin:6px 0 10px;}
p{color:#9b98b5;max-width:420px;margin:0 auto 30px;}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 30px -8px rgba(124,92,255,.7);transition:transform .3s var(--ease),box-shadow .3s;}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 36px -8px rgba(124,92,255,.9);}
:focus-visible{outline:2px solid var(--a2);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;animation-iteration-count:1 !important;}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><span></span><span></span></div>
<div class="box">
  <span class="label">Game over</span>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This level doesn't exist, or the link is broken. Let's get you back to the start.</p>
  <a href="/" class="btn" id="homeBtn">Continue? Back to home</a>
<script>
  // When opened from your computer, go to the local index.html instead
  if (location.protocol === 'file:') document.getElementById('homeBtn').href = 'index.html';
</script>
</div>
</body>
</html>
